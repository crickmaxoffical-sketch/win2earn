<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Win2Earn - Register</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background-color: #1e293b; padding: 25px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
    .input-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 14px; color: #94a3b8; }
    input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #334155; background-color: #0f172a; color: #fff; font-size: 16px; outline: none; }
    input:focus { border-color: #38bdf8; }
    button { width: 100%; padding: 12px; border: none; border-radius: 6px; background-color: #0284c7; color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:hover { background-color: #0369a1; }
    #msg { margin-top: 15px; text-align: center; font-size: 14px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Win2Earn Registration</h2>
    <form id="registerForm">
      <div class="input-group">
        <label for="phone">Phone Number</label>
        <input type="text" id="phone" placeholder="Enter phone number" required>
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>
      <button type="submit" id="submitBtn">Register</button>
    </form>
    <div id="msg"></div>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const msg = document.getElementById('msg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.style.color = '#38bdf8';
      msg.innerText = 'Connecting to server...';
      submitBtn.disabled = true;

      const phone = document.getElementById('phone').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('https://win2earn.onrender.com/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password })
        });

        const data = await response.json();

        if (response.ok) {
          msg.style.color = '#4ade80';
          msg.innerText = 'Registration successful! User ID: ' + data.userId;
          form.reset();
        } else {
          msg.style.color = '#f87171';
          msg.innerText = data.message || 'Registration failed.';
        }
      } catch (err) {
        msg.style.color = '#f87171';
        msg.innerText = 'Server connection error. Please try again.';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
