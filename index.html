<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win2Earn - Sign Up & OTP Verification</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h2 {
            margin-bottom: 8px;
            color: #f59e0b;
            font-size: 24px;
        }
        p.subtitle {
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 13px;
            color: #c9d1d9;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #f59e0b;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #f59e0b;
            color: #000000;
            font-weight: bold;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #d97706;
        }
        #otpBox {
            display: none;
        }
        .status-msg {
            margin-top: 15px;
            font-size: 14px;
            color: #38bdf8;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Win2Earn</h2>
        <p class="subtitle">Create an account to start earning</p>

        <!-- Step 1: Registration Form -->
        <div id="registerBox">
            <div class="form-group">
                <label for="email">Gmail Address</label>
                <input type="email" id="email" placeholder="example@gmail.com" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter Phone Number" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter Password" required>
            </div>
            <button onclick="sendOTP()">Send OTP</button>
        </div>

        <!-- Step 2: OTP Verification Form -->
        <div id="otpBox">
            <div class="form-group">
                <label for="otpInput">Enter 6-Digit OTP</label>
                <input type="text" id="otpInput" placeholder="123456" maxlength="6" required>
            </div>
            <button onclick="verifyOTP()">Verify OTP & Register</button>
        </div>

        <p id="msgText" class="status-msg"></p>
    </div>

    <script>
        const BACKEND_URL = "https://win2earn.onrender.com";

        async function sendOTP() {
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value.trim();
            const msgText = document.getElementById('msgText');

            if (!email || !phone || !password) {
                alert("Please fill all details!");
                return;
            }

            msgText.style.color = "#38bdf8";
            msgText.innerText = "Sending OTP to your Gmail...";

            try {
                const response = await fetch(`${BACKEND_URL}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, phone, password })
                });

                const data = await response.json();
                msgText.innerText = data.message;

                if (response.ok) {
                    document.getElementById('registerBox').style.display = 'none';
                    document.getElementById('otpBox').style.display = 'block';
                } else {
                    msgText.style.color = "#f87171";
                }
            } catch (error) {
                msgText.style.color = "#f87171";
                msgText.innerText = "Server Error. Please try again!";
            }
        }

        async function verifyOTP() {
            const email = document.getElementById('email').value.trim();
            const otp = document.getElementById('otpInput').value.trim();
            const msgText = document.getElementById('msgText');

            if (!otp) {
                alert("Please enter the OTP!");
                return;
            }

            msgText.style.color = "#38bdf8";
            msgText.innerText = "Verifying OTP...";

            try {
                const response = await fetch(`${BACKEND_URL}/api/verify-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp })
                });

                const data = await response.json();

                if (response.ok) {
                    alert("Verification Successful! Account Created.");
                    window.location.reload();
                } else {
                    msgText.style.color = "#f87171";
                    msgText.innerText = data.message || "Invalid OTP";
                }
            } catch (error) {
                msgText.style.color = "#f87171";
                msgText.innerText = "Verification failed. Try again!";
            }
        }
    </script>
</body>
</html>
