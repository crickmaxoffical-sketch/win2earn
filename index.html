<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win2Earn - India's First Paper Glide Game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: #030712; color: #ffffff; padding-bottom: 50px; }
        
        /* Navbar */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background: #0b111e; border-bottom: 1px solid rgba(255, 255, 255, 0.08); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: 900; color: #ffffff; }
        .logo span { color: #fbbf24; }
        .nav-btns { display: flex; gap: 10px; align-items: center; }
        .btn-login { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); color: #f1f5f9; padding: 8px 16px; border-radius: 10px; font-weight: 700; cursor: pointer; }
        .btn-signup { background: #fbbf24; border: none; color: #000000; padding: 8px 18px; border-radius: 10px; font-weight: 800; cursor: pointer; }

        /* User Profile Pill in Navbar */
        .profile-pill { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.08); padding: 5px 12px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.15); }
        .profile-avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 2px solid #fbbf24; }
        .wallet-badge { background: #22c55e; color: #000; padding: 3px 10px; border-radius: 20px; font-weight: 800; font-size: 12px; }
        .btn-logout { background: #ef4444; color: #fff; border: none; padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; margin-left: 5px; }

        /* Container & Cards */
        .container { max-width: 480px; margin: 0 auto; padding: 20px 16px; }
        .hero-headline { text-align: center; padding: 15px 5px 15px 5px; }
        .hero-title { font-size: 24px; font-weight: 900; color: #ffffff; }
        .hero-title span { color: #fbbf24; }

        /* Deposit & Withdraw Action Bar (Hidden by default) */
        .wallet-actions { display: none; justify-content: center; gap: 12px; margin-bottom: 20px; }
        .btn-deposit { background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; font-weight: 800; border: none; padding: 12px 22px; border-radius: 12px; cursor: pointer; font-size: 14px; box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3); }
        .btn-withdraw { background: linear-gradient(135deg, #fbbf24, #d97706); color: #000; font-weight: 800; border: none; padding: 12px 22px; border-radius: 12px; cursor: pointer; font-size: 14px; box-shadow: 0 4px 15px rgba(251, 191, 36, 0.3); }

        .card { background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 20px; margin-bottom: 18px; text-align: center; }
        .btn-main { background: #fbbf24; color: #000; border: none; width: 100%; padding: 14px; border-radius: 12px; font-weight: 900; font-size: 15px; cursor: pointer; }

        /* MODAL STYLES */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); z-index: 1000; justify-content: center; align-items: center; padding: 16px; }
        .modal-content { background: #0f172a; border: 1px solid rgba(251, 191, 36, 0.35); padding: 24px 20px; border-radius: 20px; width: 100%; max-width: 420px; position: relative; text-align: center; }
        .close-btn { position: absolute; top: 12px; right: 16px; font-size: 24px; color: #94a3b8; cursor: pointer; }
        
        .tab-buttons { display: flex; background: rgba(255, 255, 255, 0.05); border-radius: 10px; padding: 4px; margin-bottom: 18px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #94a3b8; font-weight: 700; border-radius: 8px; cursor: pointer; }
        .tab-btn.active { background: #fbbf24; color: #000; }

        .form-group { margin-bottom: 12px; text-align: left; }
        .form-group label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 4px; }
        .modal input { width: 100%; padding: 11px 14px; background: #030712; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; color: #fff; outline: none; }
    </style>
</head>
<body>

    <!-- TOP NAVBAR -->
    <div class="navbar">
        <div class="logo">Win<span>2Earn</span></div>
        <div class="nav-btns" id="navBtnsContainer">
            <!-- Dynamic Content (Login/Signup Buttons OR Profile Section) -->
        </div>
    </div>

    <div class="container">
        <div class="hero-headline">
            <h1 class="hero-title">INDIA'S FIRST <span>PAPER GLIDE</span> GAME</h1>
        </div>

        <!-- DEPOSIT & WITHDRAW ACTION BUTTONS (Only visible after Login) -->
        <div class="wallet-actions" id="walletActions">
            <button class="btn-deposit" onclick="handleDeposit()">➕ Deposit Cash</button>
            <button class="btn-withdraw" onclick="handleWithdraw()">💸 Withdraw</button>
        </div>

        <div class="card">
            <h2>Paper Glide Arena</h2>
            <br>
            <button class="btn-main" onclick="handlePlayNowClick()">🎮 Play Now & Win Real Cash</button>
        </div>
    </div>

    <!-- AUTHENTICATION MODAL -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeAuth()">&times;</span>
            
            <div class="tab-buttons">
                <button class="tab-btn" id="tabSignup" onclick="switchTab('signup')">Sign Up</button>
                <button class="tab-btn" id="tabLogin" onclick="switchTab('login')">Login</button>
            </div>

            <!-- LOGIN FORM -->
            <div id="loginSection" style="display: none;">
                <div class="form-group">
                    <label>Gmail Address</label>
                    <input type="email" id="loginEmail" placeholder="Enter email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password">
                </div>
                <button class="btn-main" style="margin-top: 10px;" onclick="handleLogin()">Login Now</button>
            </div>

            <!-- SIGN UP FORM -->
            <div id="signupSection">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="signupName" placeholder="Your Name">
                </div>
                <div class="form-group">
                    <label>Gmail Address</label>
                    <input type="email" id="signupEmail" placeholder="Your Email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signupPassword" placeholder="Create Password">
                </div>
                <button class="btn-main" style="margin-top: 8px;" onclick="handleSignup()">Complete Sign Up</button>
            </div>
        </div>
    </div>

    <script>
        // Page Load check
        window.addEventListener('DOMContentLoaded', () => {
            checkUserState();
        });

        function checkUserState() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            const navContainer = document.getElementById('navBtnsContainer');
            const walletActions = document.getElementById('walletActions');

            if (user) {
                // USER LOGGED IN STATE
                navContainer.innerHTML = `
                    <div class="profile-pill">
                        <img src="${user.profilePic || 'https://via.placeholder.com/30'}" class="profile-avatar">
                        <span style="font-weight:700; font-size:13px;">${user.name}</span>
                        <span class="wallet-badge">₹${user.balance || 0}</span>
                        <button class="btn-logout" onclick="handleLogout()">Logout</button>
                    </div>
                `;
                walletActions.style.display = 'flex'; // Show Deposit/Withdraw
            } else {
                // LOGGED OUT STATE
                navContainer.innerHTML = `
                    <button class="btn-login" onclick="openAuth('login')">Login</button>
                    <button class="btn-signup" onclick="openAuth('signup')">Sign Up</button>
                `;
                walletActions.style.display = 'none'; // Hide Deposit/Withdraw
            }
        }

        function openAuth(mode) {
            document.getElementById('authModal').style.display = 'flex';
            switchTab(mode);
        }

        function closeAuth() {
            document.getElementById('authModal').style.display = 'none';
        }

        function switchTab(mode) {
            if (mode === 'login') {
                document.getElementById('tabLogin').classList.add('active');
                document.getElementById('tabSignup').classList.remove('active');
                document.getElementById('loginSection').style.display = 'block';
                document.getElementById('signupSection').style.display = 'none';
            } else {
                document.getElementById('tabSignup').classList.add('active');
                document.getElementById('tabLogin').classList.remove('active');
                document.getElementById('signupSection').style.display = 'block';
                document.getElementById('loginSection').style.display = 'none';
            }
        }

        function handleSignup() {
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value.trim();

            if (!name || !email || !password) {
                alert("Please fill all fields!");
                return;
            }

            const userData = { name, email, password, balance: 0, profilePic: 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png' };
            localStorage.setItem(email, JSON.stringify(userData));
            localStorage.setItem('currentUser', JSON.stringify(userData));

            closeAuth();
            checkUserState();
        }

        function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            const savedUser = localStorage.getItem(email);
            if (!savedUser) {
                alert("Account not found. Please Sign Up!");
                return;
            }

            const userData = JSON.parse(savedUser);
            if (userData.password !== password) {
                alert("Wrong password!");
                return;
            }

            localStorage.setItem('currentUser', JSON.stringify(userData));
            closeAuth();
            checkUserState();
        }

        function handleLogout() {
            localStorage.removeItem('currentUser');
            checkUserState();
        }

        function handlePlayNowClick() {
            const user = localStorage.getItem('currentUser');
            if (!user) {
                openAuth('login');
            } else {
                alert("Starting Match...");
            }
        }

        function handleDeposit() {
            alert("Deposit Gateway Opening...");
        }

        function handleWithdraw() {
            alert("Withdrawal Portal Opening...");
        }
    </script>
</body>
</html>
